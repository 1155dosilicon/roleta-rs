[package]
name = "roleta"
version = "0.1.0"
edition = "2024"
description = "Menu radial para Windows acionado pelo botão lateral do mouse"
license = "BSD-3-Clause"
repository = "https://github.com/1155dosilicon/roleta-rs"
readme = "README.md"
keywords = ["windows", "mouse", "pie-menu", "radial-menu", "atalhos"]
categories = ["gui"]

[dependencies]
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Security", "Win32_Media", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# o desenho fica lento demais sem otimização mesmo em modo debug
[profile.dev.package."*"]
opt-level = 3
