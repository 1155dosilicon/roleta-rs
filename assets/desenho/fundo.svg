<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-arcoiris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF3CAC"/>
      <stop offset="28%"  stop-color="#784BA0"/>
      <stop offset="56%"  stop-color="#2B86C5"/>
      <stop offset="82%"  stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#FEE440"/>
    </linearGradient>
    <radialGradient id="fundo-vidro" cx="50%" cy="50%" r="50%">
      <stop offset="25%"  stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.88"/>
    </radialGradient>
  </defs>

  <!-- Anel principal (com furo central via evenodd) -->
