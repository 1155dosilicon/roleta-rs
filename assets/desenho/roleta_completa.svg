      <stop offset="28%" stop-color="#784BA0"/>
      <stop offset="56%" stop-color="#2B86C5"/>
      <stop offset="82%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#FEE440"/>
    </linearGradient>
    <radialGradient id="fundo-vidro" cx="50%" cy="50%" r="50%">
