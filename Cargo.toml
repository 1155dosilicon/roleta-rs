[package]
name = "roleta"
version = "0.2.1"
edition = "2024"
# let chains e slice::as_chunks (1.88), File::try_lock (1.89)
rust-version = "1.89"
description = "Menu radial para Windows e Linux (X11) acionado pelo botão lateral do mouse"
license = "BSD-3-Clause"
repository = "https://github.com/1155dosilicon/roleta-rs"
readme = "README.md"
keywords = ["windows", "linux", "mouse", "pie-menu", "radial-menu"]
categories = ["gui"]

[dependencies]
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Security", "Win32_Media", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["xtest", "shape", "randr"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"

[lints.clippy]
# todo bloco unsafe explica por que é seguro (// SAFETY: ...)
undocumented_unsafe_blocks = "warn"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# o desenho fica lento demais sem otimização mesmo em modo debug
[profile.dev.package."*"]
opt-level = 3
