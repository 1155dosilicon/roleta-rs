  <!-- Contornos em gradiente colorido -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#grad-arcoiris)" stroke-width="5"/>
  <circle cx="256" cy="256" r="68"  fill="none" stroke="url(#grad-arcoiris)" stroke-width="3.5"/>

  <!-- Divisórias sutis -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.16">
    <line x1="216.03" y1="200.99" x2="120.81" y2="69.93"/>
    <line x1="295.97" y1="200.99" x2="391.19" y2="69.93"/>
    <line x1="320.67" y1="277.01" x2="474.74" y2="327.07"/>
    <line x1="256.00" y1="324.00" x2="256.00" y2="486.00"/>
    <line x1="191.33" y1="277.01" x2="37.26"  y2="327.07"/>
